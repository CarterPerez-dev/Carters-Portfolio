[uwsgi]
# Flask application
module = app:app

# Server settings
http-socket = 0.0.0.0:5000
master = true
processes = 6 

# Async settings 
async = 1000 
gevent = 1000
thunder-lock = true

# WebSocket support
http-websockets = true
http-auto-chunked = true
http-keepalive = true

# Performance settings
buffer-size = 65535  
socket-timeout = 65
harakiri = 60
post-buffering = 8192

harakiri = 60
harakiri-verbose = true

reload-on-rss = 512
evil-reload-on-rss = 768

# Keep-alive settings
http-keepalive = 30

# gevent stability settings
lazy-apps = true
need-app = true

# Logging
memory-report = true
log-4xx = true
log-5xx = true
