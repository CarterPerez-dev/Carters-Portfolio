[project]
name = "carter"
version = "1.0.0"
description = "Carters API"
requires-python = ">=3.11"
authors = [
    {name = "CartersPortfolio", email = "carterperez@certgames.com"}
]

dependencies = [

    "annotated-types==0.7.0",
    "anyio==4.10.0",
    
    "bcrypt==4.3.0",
    "bidict==0.23.1",
    
    "certifi==2025.8.3",
    "cffi==1.17.1",
    "cryptography==45.0.6",
    
    "dnspython==2.7.0",
    "email-validator==2.2.0",
    
    "Flask==3.1.1",
    "Flask-CORS==6.0.1",
    "Flask-Limiter==3.12",
    "Flask-Migrate==4.1.0",
    "Flask-PyMongo==3.0.1",
    "flask-restx==1.3.0",
    
    "gevent==25.5.1",
    
    "httpx==0.28.1",
    "idna==3.10",
    
    "MarkupSafe==3.0.2",
    "marshmallow==4.0.0",
    "mongoengine==0.29.1",
    
    "psutil==7.0.0",
    "pydantic==2.11.7",
    "pymongo[srv]==4.14.0",
    "python-dotenv==1.1.1",
    "pytz==2025.2",
    
    "redis==6.4.0",
    "requests==2.32.4",
    "resend==2.12.0",
    
    "schedule==1.2.2",
    
    "tqdm==4.67.1",
    "typing_extensions==4.14.1",
    "tzdata==2025.2",
    
    "user-agents==2.2.0",
    "uwsgi==2.0.30",
    "Werkzeug==3.1.3",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]==1.8.6",
    "deptry==0.23.1",
    
    "factory-boy==3.3.3",
    "flask-debugtoolbar==0.16.0",
    
    "ipython==9.4.0",
    "mypy==1.17.1",
    
    "pip-audit==2.9.0",
    "pip-tools==7.5.0",
    "pip-review==1.3.0",
    "pre-commit==4.3.0",
    "pylint==3.3.8",
    "pylint-flask==0.6",
    "pylint-mongoengine==0.6.0",
    "pylint-per-file-ignores==1.4.0",
    "pylint-plugin-utils==0.9.0",
    "pylint-pydantic==0.3.5",
    
    "ruff==0.12.8",

    "types-pytz==2025.2.0.20250809",
    "types-PyYAML==6.0.12.20250809",
    "types-redis==4.6.0.20241004",
    "types-requests==2.32.4.20250809",
    
    "watchdog[watchmedo]==6.0.0",
    "yapf==0.43.0",
]


[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["CarterRun", "config"]

[tool.setuptools.packages.find]
include = ["api", "app"]

[tool.ruff]
target-version = "py311"
line-length = 95
indent-width = 4
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pycache__",
    "_build",
    "build",
    "dist",
    "site-packages",
    "venv",
    "migrations",
    "devtools",
    "app/factory.py",
    "app/clients/webhooks.py",
]

[tool.ruff.format]
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E1",   # Indentation
    "E4",   # Imports
    "E7",   # Statement
    "F",    # Pyflakes (all F rules)
    "W292", # No newline at end of file
    "W605", # Invalid escape sequence
    "B",    # Bugbear
    "C4",   # Comprehensions
    "UP",   # Pyupgrade
    "ARG",  # Unused arguments
    "SIM",  # Simplify
    "I",    # isort rules
    "F401", # Unused imports
    "F811", # Redefined imports
    "F821", # Undefined name
]

ignore = [
    "E501",   # Line length (handled by formatter)
    "W291",   # Trailing whitespace
    "W293",   # Blank line contains whitespace
    "I001",   # Import sorting
    "RUF001", # Ambiguous unicode
    "RUF002", # Docstring with ambiguous unicode
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["ALL"]
"app/restx/*" = ["E402", "F401", "W605"]
"api/projects/Project.py" = ["ARG002"]  # Unused method arguments in webhook handlers
"api/projects/github_sync.py" = ["SIM102"]  # Nested if for PORTFOLIO_HIDE check  

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
namespace_packages = true
explicit_package_bases = true

warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false 

show_error_codes = true
pretty = true
show_column_numbers = true
show_error_context = true

exclude = [
    ".venv",
    "venv",
]

[[tool.mypy.overrides]]
module = ["api.*.routes", "api.*.*.routes"]
disable_error_code = ["attr-defined"]

[[tool.mypy.overrides]]
module = ["api.*.Blog", "api.*.Contact", "api.*.Project"]
disable_error_code = ["dict-item", "no-any-return"]

[[tool.mypy.overrides]]
module = ["api.core.database.connection"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["api.*.controllers"]
disable_error_code = ["arg-type", "typeddict-item", "no-any-return"]

[[tool.mypy.overrides]]
module = ["api.projects.github_sync"]
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = ["api.core.cache.*"]
disable_error_code = ["attr-defined", "no-any-return"]

[[tool.mypy.overrides]]
module = ["api.core.middleware.request_id"]
disable_error_code = ["no-any-return"]

[[tool.mypy.overrides]]
module = ["app.factory"]
disable_error_code = ["arg-type"]

[tool.bandit]
exclude_dirs = [
    "qa", 
    "migrations", 
    "devtools", 
    ".venv", 
    "venv",
    "run"
]
skips = ["B104"]

[tool.vulture]
exclude = [
    "qa/", 
    "migrations/", 
    "devtools/", 
    ".venv/", 
    "venv/",
    "run/"    
]
min_confidence = 90
paths = ["api", "app"]

[tool.pylint.main]
py-version = "3.11"
jobs = 4
load-plugins = [
    "pylint_mongoengine", 
    "pylint_pydantic", 
    "pylint_per_file_ignores", 
    "pylint_flask", 
    "pylint_celery"
]
persistent = true
suggestion-mode = true
ignore = [
    "venv", 
    ".venv", 
    "__pycache__",  
    "build", 
    "dist", 
    ".git",
    ".pytest_cache", 
    ".mypy_cache", 
    ".ruff_cache", 
    "ops"
]
ignore-paths = [
    "^venv/.*", 
    "^.venv/.*", 
    "^build/.*", 
    "^dist/.*", 
    "^ops/.*"
]
[tool.pylint.type-check]
generated-members = [
    "objects",
    "id",
    "get_or_create",
    "DoesNotExist",
    "MultipleObjectsReturned",
    "objects.get_or_create"
]
# False positives from MongoEngine QuerySet methods
ignored-classes = ["QuerySet"]

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
    "W0511",  # fixme
    "W0622",  # redefined-builtin
    "W0612",  # unused-variable (handled by ruff)
    "W0613",  # unused-argument (handled by ruff)
    "C0301", # Line too long
    "C0302", # Too many lines
    "C0411", # Wrong import order
    "C0305", # Trailing newlines
    "C0303", # Trailing whitespace
    "C0304", # Final newline missing
    "R0801", # Similar lines (want exact duplicates only)
]

per-file-ignores = [
    "api/core/middleware/schema.py:R0911,W0718",   # Ignore broad exception catching
    "api/core/services/EmailSender.py:W0718",   # Ignore broad exception catching
    "api/contact/controllers.py:W0718", # Ignore broad exception catching
    "app/restx/api.py:E0611,C0415,W061,E0401",   # Ignore no name
    "CarterRun.py:W0105", #ASCII art
    "app/factory.py:C0413",  # wrong-import-position - gevent monkey patching requires this
    "api/core/cache/decorators.py:R0917",  # too-many-positional-arguments - config decorator needs these
    "api/projects/Project.py:R0902",  # too-many-attributes - Project model needs all these fields
    "api/projects/github_sync.py:W0718",  # broad exception in sync_all_repos - need to continue on any error
]

[tool.pylint.format]
max-line-length = 95

[tool.pylint.design]
max-args = 15
max-attributes = 12
max-branches = 22
max-locals = 20
max-statements = 55

[tool.radon]
exclude = [
    ".venv/*",
    "venv/*",
]

[tool.codespell]
skip = ".git,__pycache__,.pytest_cache,.mypy_cache,.ruff_cache,venv,.venv,build,dist"
ignore-words-list = "ans"
